version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set}
      - DATABASE_URL_SYNC=${DATABASE_URL_SYNC:?DATABASE_URL_SYNC must be set}
      - REDIS_URL=${REDIS_URL:?REDIS_URL must be set}
      - CELERY_ENABLED=true
      - RENDER_SYNC_FALLBACK=false
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS:?BACKEND_CORS_ORIGINS must be set}
    depends_on:
      - db
      - redis
    restart: always

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    command: celery -A app.workers:celery_app worker --loglevel=info --queues=rendering
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set}
      - DATABASE_URL_SYNC=${DATABASE_URL_SYNC:?DATABASE_URL_SYNC must be set}
      - REDIS_URL=${REDIS_URL:?REDIS_URL must be set}
      - CELERY_ENABLED=true
    depends_on:
      - db
      - redis
    restart: always

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER must be set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    restart: always

volumes:
  postgres_data:
